services:
  app:
    build: .
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./userdata:/userdata
      - ./responses:/responses
      - ./downloads:/root/Downloads
      - ./extension:/extension:ro
    environment:
      STARTUP_URLS: https://x.com
      TARGET_URL_REGEXS: |-
        https://.*twitter.com/.*
        https://.*x.com/.*
      VNC_SCREEN_SIZE: 600x1440
      ACTIVE_ADDONS: Twitter
    env_file:
      - .env
